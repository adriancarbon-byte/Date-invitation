[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[template.environment]
  WEB3FORMS_ACCESS_KEY = "Paste your verified Web3Forms access key. Used privately by the email function."
